
user              nginx;
worker_processes  auto;

error_log         /var/log/nginx/error.log notice;
pid               /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
  include             /etc/nginx/mime.types;
  default_type        application/octet-stream;

  log_format  main    '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log          /var/log/nginx/access.log  main;

  sendfile            on;
  #tcp_nopush         on;

  keepalive_timeout   65;

  server_tokens       off;

  gzip                on;
  gzip_http_version   1.1;
  gzip_disable        "MSIE [1-6]\.";
  gzip_vary           on;
  gzip_proxied        any;
  gzip_comp_level     5;
  gzip_min_length     256;
  gzip_buffers        4 32k;
  # image/svg+xml: the icon sprites and the illustrations are SVG (text, they shrink ~5-8x)
  gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

  server {
    listen    80;

    root      /usr/share/nginx/html;
    index     index.html;

    # Set here and not inside the locations below: a location that has its own add_header drops these.
    add_header  X-Content-Type-Options  "nosniff"                         always;
    add_header  X-Frame-Options         "SAMEORIGIN"                      always;
    add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # The build output is named after its content (main-ABCDEFGH.js, chunk-ABCDEFGH.js,
    # styles-ABCDEFGH.css, component-ABCDEFGH.css): a name never changes meaning, so cache it for a
    # year. A file that does not exist is a 404 (not index.html), so a stale tab that asks for a
    # chunk of the previous deploy fails loudly instead of parsing HTML as JavaScript.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
      expires 1y;
    }

    # What names the hashed files, and the runtime config (rendered at container start): always
    # revalidate, or a deploy is not seen until the old copy expires.
    location = /index.html {
      expires -1;
    }

    location = /environments/env.js {
      expires -1;
    }

    # Not hashed (the sprites are loaded by URL): a day, so a changed icon shows up the next day.
    location ~* ^/(?:icons|images)/ {
      expires 1d;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
