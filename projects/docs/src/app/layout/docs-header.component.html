<header class="border-border bg-background/80 sticky top-0 z-40 w-full border-b backdrop-blur-md">
  <div class="flex h-14 items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <div
        class="bg-primary text-primary-content flex h-8 w-8 items-center justify-center rounded-lg text-sm font-bold shadow-xs"
      >
        UI
      </div>
      <span class="text-base font-semibold tracking-tight">@libs/ui</span>
      <span class="bg-muted text-muted-foreground rounded-full px-2 py-0.5 font-mono text-xs">v0.1.0</span>
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="border-border bg-background text-foreground hover:bg-muted inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border transition-colors"
        [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme()"
      >
        @if (isDark()) {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        } @else {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
