<ng-content select="[uiTagIcon]" />
<span
  class="tag-label"
  [id]="labelId"
>
  <ng-content />
</span>
@if (removable()) {
  <button
    type="button"
    class="tag-remove"
    [disabled]="disabled()"
    [attr.aria-labelledby]="removeTextId + ' ' + labelId"
    (click)="remove($event)"
    (keydown.backspace)="remove($event)"
    (keydown.delete)="remove($event)"
  >
    <span
      class="sr-only"
      [id]="removeTextId"
    >
      {{ removeLabel() }}
    </span>
    <svg
      class="size-3"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
}
