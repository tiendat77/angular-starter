<vertical-navigation
  #nav="verticalNavigation"
  class="bg-background print:hidden"
  [appearance]="$navigationAppearance()"
  [mode]="$isScreenSmall() ? 'over' : 'side'"
  [name]="'main-navigation'"
  [navigation]="$navigation()"
  [opened]="!$isScreenSmall()"
>
  <ng-container verticalNavigationContentHeader>
    <div class="relative flex h-20 items-center justify-center">
      <logo
        routerLink="/"
        class="w-12 cursor-pointer"
      />

      <button
        type="button"
        class="btn btn-circle btn-ghost absolute right-3 sm:hidden"
        aria-label="Close navigation"
        (click)="nav.close()"
      >
        <svg-icon name="heroicons_outline:x-mark" />
      </button>
    </div>
  </ng-container>
</vertical-navigation>

<div class="flex w-full min-w-0 flex-auto flex-col">
  <!-- Header -->
  <div class="bg-background sticky inset-x-0 top-0 z-49 flex-0 border-b print:hidden">
    <div class="mx-auto flex min-h-16 w-full items-center p-2 px-4 sm:px-6 md:px-8">
      <div class="flex-1">
        <button
          class="btn btn-circle btn-ghost"
          aria-label="Toggle navigation"
          (click)="toggle()"
        >
          <svg-icon name="heroicons_outline:bars-3-bottom-left" />
        </button>
      </div>

      <div class="ml-auto flex flex-none items-center space-x-0.5 pl-2 sm:space-x-2">
        <!-- <user /> -->
        <!-- <notification /> -->
        <theme-toggler />
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-auto flex-col overflow-hidden">
    <main class="mx-auto flex w-full flex-auto flex-col p-4 sm:p-6 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
