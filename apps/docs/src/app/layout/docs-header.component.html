<header class="border-border bg-background/80 sticky top-0 z-40 w-full border-b backdrop-blur-md">
  <div class="flex h-14 items-center justify-between px-4 md:px-6">
    <div class="flex items-center gap-3">
      <!-- Mobile only: opens and closes the navigation drawer -->
      <button
        type="button"
        class="border-border bg-background text-foreground hover:bg-muted inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border transition-colors md:hidden"
        aria-controls="docs-sidebar"
        [attr.aria-expanded]="sidebar.open()"
        [attr.aria-label]="sidebar.open() ? 'Close navigation' : 'Open navigation'"
        (click)="sidebar.toggle()"
      >
        <svg
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @if (sidebar.open()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 6h16M4 12h16M4 18h16" />
          }
        </svg>
      </button>
      <div
        class="bg-primary text-primary-content flex h-8 w-8 items-center justify-center rounded-lg text-sm font-bold shadow-xs"
      >
        UI
      </div>
      <span class="text-base font-semibold tracking-tight">@libs/ui</span>
      <span class="bg-muted text-muted-foreground rounded-full px-2 py-0.5 font-mono text-xs">v0.1.0</span>
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="border-border bg-background text-foreground hover:bg-muted inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border transition-colors"
        [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme()"
      >
        @if (isDark()) {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              cx="12"
              cy="12"
              r="4"
            />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41"
            />
          </svg>
        } @else {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
