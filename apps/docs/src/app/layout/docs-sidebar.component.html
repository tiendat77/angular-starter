@if (state.open()) {
  <!-- Mobile only: tapping outside the drawer closes it -->
  <div
    class="bg-foreground/30 fixed inset-x-0 top-14 bottom-0 z-30 md:hidden"
    aria-hidden="true"
    (click)="state.close()"
  ></div>
}

<aside
  id="docs-sidebar"
  class="border-border bg-background fixed top-14 bottom-0 left-0 z-40 w-64 shrink-0 overflow-y-auto border-r p-6 transition-[translate,visibility] duration-200 md:sticky md:z-auto md:h-[calc(100vh-3.5rem)] md:translate-x-0 md:transition-none"
  [class.-translate-x-full]="!state.open()"
  [class.max-md:invisible]="!state.open()"
>
  @for (group of navGroups; track group.title) {
    <div class="mb-6">
      <h4 class="text-muted-foreground mb-3 text-xs font-semibold tracking-wider uppercase">{{ group.title }}</h4>
      <nav class="space-y-1">
        @for (item of group.items; track item.path) {
          <a
            routerLinkActive="bg-muted text-foreground font-medium"
            class="text-muted-foreground hover:bg-muted/60 hover:text-foreground flex items-center rounded-md px-3 py-2 text-sm transition-colors"
            [routerLink]="item.path"
            (click)="state.close()"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  }
</aside>
