<doc-playground
  title="Date Picker"
  description="Calendar date picker connected to a text input and Angular forms. Opens in a CDK overlay; supports min/max, date filters and month/year views."
  [code]="generatedCode()"
>
  <!-- Live Preview -->
  <div
    preview
    class="flex w-full max-w-xs flex-col gap-3 p-4"
  >
    <label class="input w-full">
      <datepicker-toggle [for]="picker" />
      <input
        placeholder="Pick a date"
        [datepicker]="picker"
        [formControl]="control"
        [datepickerFilter]="dateFilter"
      />
    </label>
    <date-picker
      #picker
      [startView]="startView()"
      [showLunar]="showLunar()"
    >
      @if (showExtra()) {
        <ng-template
          let-date
          datepickerDayExtra
        >
          {{ price(date) }}
        </ng-template>
      }
    </date-picker>
    <p class="text-muted-foreground text-sm">
      Value:
      <span class="text-foreground font-mono">{{ control.value ? (control.value | date: 'yyyy-MM-dd') : 'null' }}</span>
    </p>
  </div>

  <!-- Controls -->
  <div
    controls
    class="space-y-4 text-xs"
  >
    <div>
      <label
        for="dp-view"
        class="text-muted-foreground mb-1 block font-medium"
      >
        Start view
      </label>
      <select
        id="dp-view"
        class="border-border bg-background text-foreground w-full rounded-lg border px-3 py-1.5"
        [ngModel]="startView()"
        (ngModelChange)="startView.set($event)"
      >
        <option value="month">month</option>
        <option value="year">year</option>
        <option value="multi-year">multi-year</option>
      </select>
    </div>

    <div class="border-border/50 space-y-2 border-t pt-2">
      <label class="flex cursor-pointer items-center gap-2">
        <input
          type="checkbox"
          class="border-border rounded"
          [ngModel]="weekdaysOnly()"
          (ngModelChange)="weekdaysOnly.set($event)"
        />
        <span>Weekdays only (filter)</span>
      </label>
      <label class="flex cursor-pointer items-center gap-2">
        <input
          type="checkbox"
          class="border-border rounded"
          [ngModel]="showLunar()"
          (ngModelChange)="showLunar.set($event)"
        />
        <span>Lunar calendar (Âm lịch)</span>
      </label>
      <label class="flex cursor-pointer items-center gap-2">
        <input
          type="checkbox"
          class="border-border rounded"
          [ngModel]="showExtra()"
          (ngModelChange)="showExtra.set($event)"
        />
        <span>Extra text (price)</span>
      </label>
      <label class="flex cursor-pointer items-center gap-2">
        <input
          type="checkbox"
          class="border-border rounded"
          [ngModel]="vietnamese()"
          (ngModelChange)="setVietnamese($event)"
        />
        <span>Vietnamese locale</span>
      </label>
      <label class="flex cursor-pointer items-center gap-2">
        <input
          type="checkbox"
          class="border-border rounded"
          [ngModel]="disabled()"
          (ngModelChange)="toggleDisabled($event)"
        />
        <span>Disabled</span>
      </label>
    </div>
  </div>

  <doc-api-table [rows]="apiRows" />
</doc-playground>

<doc-playground
  class="mt-16 block"
  title="Date Range Picker"
  description="Two months side by side. Hovering previews the range with a dashed outline, and the picker closes once the end date is picked."
  [code]="rangeCode()"
>
  <div
    preview
    class="flex w-full max-w-sm flex-col gap-3 p-4"
  >
    <label class="input w-full">
      <datepicker-toggle [for]="rangePicker" />
      <input
        placeholder="Check-in – Check-out"
        [dateRangePicker]="rangePicker"
        [formControl]="rangeControl"
      />
    </label>
    <date-range-picker
      #rangePicker
      [showLunar]="rangeLunar()"
    >
      @if (rangeExtra()) {
        <ng-template
          datepickerDayExtra
          let-date
        >
          {{ price(date) }}
        </ng-template>
      }
    </date-range-picker>
    <p class="text-muted-foreground text-sm">
      Value:
      <span class="text-foreground font-mono">{{ rangeText() }}</span>
    </p>
  </div>

  <div
    controls
    class="space-y-2 text-xs"
  >
    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="checkbox"
        class="border-border rounded"
        [ngModel]="rangeLunar()"
        (ngModelChange)="rangeLunar.set($event)"
      />
      <span>Lunar calendar (Âm lịch)</span>
    </label>
    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="checkbox"
        class="border-border rounded"
        [ngModel]="rangeExtra()"
        (ngModelChange)="rangeExtra.set($event)"
      />
      <span>Extra text (price)</span>
    </label>
  </div>
</doc-playground>
