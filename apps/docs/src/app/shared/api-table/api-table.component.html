<section class="mt-8 space-y-4">
  <h2 class="text-foreground text-xl font-bold tracking-tight">{{ title() }}</h2>
  <div class="border-border overflow-x-auto rounded-xl border">
    <table class="w-full text-left text-sm">
      <thead class="bg-muted/50 border-border text-muted-foreground border-b text-xs uppercase">
        <tr>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Type</th>
          <th class="px-4 py-3">Default</th>
          <th class="px-4 py-3">Description</th>
        </tr>
      </thead>
      <tbody class="divide-border divide-y font-mono text-xs">
        @for (row of rows(); track row.name) {
          <tr>
            <td class="text-primary px-4 py-3 font-semibold whitespace-nowrap">{{ row.name }}</td>
            <td class="text-muted-foreground px-4 py-3">{{ row.type }}</td>
            <td class="px-4 py-3">{{ row.default ?? '–' }}</td>
            <td class="text-muted-foreground px-4 py-3 font-sans">{{ row.description }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
