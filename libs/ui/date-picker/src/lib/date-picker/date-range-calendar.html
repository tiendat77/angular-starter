<div class="flex gap-6 px-3 pt-2 pb-3">
  <!-- Left panel: previous year / month -->
  <div class="date-range-calendar-panel">
    <div class="date-range-calendar-header">
      <button
        type="button"
        class="btn btn-circle btn-ghost btn-sm"
        [attr.aria-label]="_intl.prevYearLabel"
        (click)="_shift(-12)"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m18 18-6-6 6-6M11 18l-6-6 6-6"
          />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-circle btn-ghost btn-sm"
        [attr.aria-label]="_intl.prevMonthLabel"
        (click)="_shift(-1)"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>
      <span
        class="date-range-calendar-title first-letter:uppercase"
        aria-live="polite"
      >
        {{ _title(_leftActive) }}
      </span>
      <span
        class="w-[4.5rem]"
        aria-hidden="true"
      ></span>
    </div>

    <month-view
      [selected]="selected"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [dateFilter]="dateFilter"
      [showLunar]="showLunar"
      [dayExtra]="dayExtra"
      [previewRange]="_preview"
      [activeDate]="_leftActive"
      (activeDateChange)="_onLeftActiveChange($event)"
      (hoverDate)="_onHover($event)"
      (_userSelection)="_userSelection.emit($event)"
    />
  </div>

  <!-- Right panel: next month / year -->
  <div class="date-range-calendar-panel">
    <div class="date-range-calendar-header">
      <span
        class="w-[4.5rem]"
        aria-hidden="true"
      ></span>
      <span
        class="date-range-calendar-title first-letter:uppercase"
        aria-live="polite"
      >
        {{ _title(_rightActive) }}
      </span>
      <button
        type="button"
        class="btn btn-circle btn-ghost btn-sm"
        [attr.aria-label]="_intl.nextMonthLabel"
        (click)="_shift(1)"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-circle btn-ghost btn-sm"
        [attr.aria-label]="_intl.nextYearLabel"
        (click)="_shift(12)"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m6 6 6 6-6 6M13 6l6 6-6 6"
          />
        </svg>
      </button>
    </div>

    <month-view
      [selected]="selected"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [dateFilter]="dateFilter"
      [showLunar]="showLunar"
      [dayExtra]="dayExtra"
      [previewRange]="_preview"
      [activeDate]="_rightActive"
      (activeDateChange)="_onRightActiveChange($event)"
      (hoverDate)="_onHover($event)"
      (_userSelection)="_userSelection.emit($event)"
    />
  </div>
</div>
