<div class="flex items-center justify-between gap-1 px-3 pt-2.5 pb-4">
  <button
    type="button"
    class="btn btn-circle btn-ghost btn-sm"
    [disabled]="!previousEnabled()"
    [attr.aria-label]="prevButtonLabel"
    (click)="previousClicked()"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.75 19.5 8.25 12l7.5-7.5"
      />
    </svg>
  </button>

  <!-- The month and the year are two buttons: each toggles a grid in place of the days -->
  <div class="flex min-w-0 flex-auto items-center justify-center">
    <div
      class="flex items-center gap-1"
      aria-live="polite"
      [class.flex-row-reverse]="yearFirst"
    >
      <button
        type="button"
        class="calendar-header-label first-letter:uppercase"
        aria-haspopup="grid"
        [attr.aria-expanded]="calendar.currentView === 'year'"
        (click)="monthLabelClicked()"
      >
        {{ monthText }}
      </button>
      <button
        type="button"
        class="calendar-header-label"
        aria-haspopup="grid"
        [attr.aria-expanded]="calendar.currentView === 'multi-year'"
        (click)="yearLabelClicked()"
      >
        {{ yearText }}
      </button>
    </div>

    <ng-content />
  </div>

  <button
    type="button"
    class="btn btn-circle btn-ghost btn-sm"
    [disabled]="!nextEnabled()"
    [attr.aria-label]="nextButtonLabel"
    (click)="nextClicked()"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m8.25 4.5 7.5 7.5-7.5 7.5"
      />
    </svg>
  </button>
</div>
