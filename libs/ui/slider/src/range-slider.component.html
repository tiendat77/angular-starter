<div
  class="slider-area"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
>
  <div
    #rail
    class="slider-rail"
  >
    <div
      class="slider-fill"
      [style.inset-inline-start.%]="fillStart()"
      [style.inset-inline-end.%]="100 - fillEnd()"
    ></div>

    @if (showTicks()) {
      <div
        class="slider-ticks"
        aria-hidden="true"
      >
        @for (tick of $ticks(); track tick) {
          <span
            class="slider-tick"
            [class.slider-tick-active]="tickActive(tick)"
            [style.inset-inline-start.%]="percentOf(tick)"
          ></span>
        }
      </div>
    }

    <ui-slider-thumb
      [thumbId]="id"
      [value]="$shown()[0]"
      [min]="$min()"
      [max]="$max()"
      [lowerBound]="$lowerBounds()[0]"
      [upperBound]="$lowerBounds()[1]"
      [step]="$step()"
      [pageStep]="$pageStep()"
      [rtl]="isRtl()"
      [percent]="percentOf($shown()[0])"
      [disabled]="$disabled()"
      [invalid]="$invalid()"
      [label]="startLabel()"
      [describedBy]="$describedBy()"
      [valueText]="valueText($shown()[0])"
      [bubbleText]="bubbleText($shown()[0])"
      [showValue]="showValue()"
      [active]="_dragging() === 0"
      (valueChange)="_setThumb(0, $event)"
    />
    <ui-slider-thumb
      [thumbId]="id + '-end'"
      [value]="$shown()[1]"
      [min]="$min()"
      [max]="$max()"
      [lowerBound]="$upperBounds()[0]"
      [upperBound]="$upperBounds()[1]"
      [step]="$step()"
      [pageStep]="$pageStep()"
      [rtl]="isRtl()"
      [percent]="percentOf($shown()[1])"
      [disabled]="$disabled()"
      [invalid]="$invalid()"
      [label]="endLabel()"
      [describedBy]="$describedBy()"
      [valueText]="valueText($shown()[1])"
      [bubbleText]="bubbleText($shown()[1])"
      [showValue]="showValue()"
      [active]="_dragging() === 1"
      (valueChange)="_setThumb(1, $event)"
    />
  </div>
</div>
