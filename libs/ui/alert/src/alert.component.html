<div class="alert-icon">
  <ng-content select="[uiAlertIcon]">
    @if (iconPath(); as path) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="path"
        />
      </svg>
    }
  </ng-content>
</div>

<div class="alert-description">
  <ng-content select="[uiAlertTitle]" />
  <ng-content />
  <ng-content select="[uiAlertActions]" />
</div>

@if (dismissible()) {
  <button
    type="button"
    class="alert-close"
    [attr.aria-label]="closeLabel()"
    (click)="close()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
}
